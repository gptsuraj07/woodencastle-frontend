<nav class="navbar">

  <!-- LEFT -->
  <div class="left" routerLink="/">
    <img src="/assets/logo1.jpg" class="logo-img" />
    <span class="brand">The Wooden Castle</span>
  </div>

  <!-- DESKTOP LINKS -->
  <div class="links desktop">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/products" routerLinkActive="active">Products</a>
    <a routerLink="/about" routerLinkActive="active">About Us</a>
    <a routerLink="/contactus" routerLinkActive="active">Contact</a>
  </div>

  <!-- MENU BUTTON -->
  <div class="menu-btn" (click)="toggleMenu()">
    <span [class.open]="menuOpen"></span>
  </div>

</nav>

<!-- OVERLAY -->
<div class="overlay" [class.show]="menuOpen" (click)="closeMenu()"></div>

<!-- SIDE DRAWER -->
<div class="drawer" [class.open]="menuOpen">

 <div class="drawer-header">

  <span class="menu-title">Menu</span>

  <button class="close-btn" (click)="closeMenu()">
    <span></span>
  </button>

</div>

  <a routerLink="/" (click)="closeMenu()">Home</a>
  <a routerLink="/products" (click)="closeMenu()">Products</a>
  <a routerLink="/about" (click)="closeMenu()">About Us</a>
  <a routerLink="/contactus" (click)="closeMenu()">Contact</a>

</div>
