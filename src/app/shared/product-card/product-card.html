<div class="card">

  <div class="image-container" (click)="handleClick($event)">
<img 
  [src]="getOptimizedImage(product.images[0])"
  (error)="onImageError($event)"
  [attr.loading]="priority ? 'eager' : 'lazy'"
  [attr.fetchpriority]="priority ? 'high' : 'auto'"
  decoding="async"
/>

    <!-- subtle overlay -->
    <!-- <div class="overlay">
      <span>View</span>
    </div> -->
  </div>

<div class="content">

  <!-- TITLE -->
  <h3>{{ product.name }}</h3>

  <!-- PRICE -->
  <div class="price-box">
    <div class="price">
      ₹ {{ getStartingPrice(product) }}
    </div>


  </div>

  <!-- VARIANTS -->
  @if (parseVariants(product.variants).length > 0) {
  <div class="variants">
    @for (v of parseVariants(product.variants); track $index) {
      <span>{{ v.type || v.label }}</span>
    }
  </div>
}

  <!-- BUTTON -->
  <a class="view-btn" (click)="handleClick($event)">
    View Details →
  </a>

</div>

</div>
